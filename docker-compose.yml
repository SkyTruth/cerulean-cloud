# Use postgres/example user/password credentials
version: '3.1'

services:

  db:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: user
      POSTGRES_DB: db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db18-data:/var/lib/postgresql
    command: postgres -c log_statement=all

volumes:
  db18-data:
